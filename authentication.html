<div class="inline-flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="auto_stories">auto_stories</span>
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter">Readify AI</h1>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface-variant leading-tight">Join the future of reading</h2>

<div class="glass-panel border border-white/50 rounded-3xl shadow-[0_20px_50px_rgba(79,70,229,0.1)] p-8 md:p-10">

<button class="flex-1 py-2.5 text-center font-label-sm text-label-sm bg-white text-primary rounded-lg shadow-sm transition-all duration-300">

<button class="flex-1 py-2.5 text-center font-label-sm text-label-sm text-outline hover:text-on-surface-variant transition-all duration-300">

                    </button>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-3 px-4 py-3 bg-white border border-outline-variant rounded-xl font-label-sm text-label-sm text-on-surface-variant hover:bg-slate-50 transition-all duration-200 active:scale-[0.98]">

<span class="material-symbols-outlined text-xl" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>

                    </button>

<div class="flex-grow h-px bg-outline-variant/50"></div>

<div class="space-y-1.5">

<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-ui-body" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="authentication.html">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none text-ui-body" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>

                        Enter Library
                        <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Text -->

<a class="text-primary hover:underline font-medium" href="settings.html">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="settings.html">Privacy Policy</a>.
