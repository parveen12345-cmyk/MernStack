<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reading | Readify AI</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary": "#4f46e5" },
                    fontFamily: { "serif": ["Newsreader", "serif"] }
                }
            }
        }
    </script>
    <style>
        body { background: #fafafa; }
        #reader-content-area p { line-height: 1.95; color: #1e293b; }
        #ai-analyze-btn { position: fixed; z-index: 200; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <!-- AI Analyze Floating Button -->
    <button id="ai-analyze-btn"
            class="hidden px-5 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-full shadow-2xl
                   flex items-center gap-2 hover:bg-indigo-700 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-base">auto_awesome</span>
        Analyze with AI
    </button>

    <!-- Top Nav -->
    <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-lg border-b border-slate-100 shadow-sm">
        <div class="flex justify-between items-center px-6 py-3 max-w-6xl mx-auto">
            <div class="flex items-center gap-8">
                <a href="dashboard.html" class="text-lg font-bold tracking-tight text-indigo-700">Readify AI</a>
                <nav class="hidden md:flex gap-6 text-sm font-medium">
                    <a href="dashboard.html" class="text-slate-500 hover:text-indigo-600 transition-colors">Discover</a>
                    <a href="library.html" class="text-slate-500 hover:text-indigo-600 transition-colors">Library</a>
                    <a href="ai_assistant.html" class="text-indigo-700 font-semibold border-b-2 border-indigo-600 pb-0.5">AI Insights</a>
                </nav>
            </div>
            <a href="dashboard.html" class="flex items-center gap-1 text-sm text-slate-500 hover:text-indigo-600 transition-colors">
                <span class="material-symbols-outlined text-base">arrow_back</span>
                Back
            </a>
        </div>
    </header>

    <!-- Left Sidebar -->
    <aside class="fixed left-0 top-[57px] h-[calc(100vh-57px)] w-60 border-r border-slate-100 bg-white p-5 hidden lg:flex flex-col gap-4">
        <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Currently Reading</p>
            <h3 id="reader-book-title" class="text-sm font-bold text-slate-700 leading-snug">Loading...</h3>
        </div>
        <div class="flex-1 flex flex-col gap-2">
            <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
                <p class="text-xs font-semibold text-indigo-700 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">auto_awesome</span>
                    AI Tip
                </p>
                <p class="text-[11px] text-indigo-600 mt-1">Highlight any text to analyze it with AI instantly!</p>
            </div>
        </div>
        <a href="ai_assistant.html"
           class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-bold text-center hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">smart_toy</span>
            Open AI Assistant
        </a>
    </aside>

    <!-- Main Content -->
    <main class="lg:ml-60 pt-20 pb-24 min-h-screen flex justify-center px-4">
        <article class="max-w-2xl w-full py-8">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-xs text-slate-400 font-medium uppercase tracking-widest mb-10">
                <a href="dashboard.html" class="hover:text-indigo-600 transition-colors">Home</a>
                <span class="material-symbols-outlined text-[10px]">chevron_right</span>
                <span class="text-indigo-600">Reading</span>
            </div>

            <!-- Book Content -->
            <div id="reader-content-area" class="font-serif text-[19px] leading-loose text-slate-700 space-y-2">
                <div class="animate-pulse space-y-4">
                    <div class="h-6 bg-slate-200 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 rounded"></div>
                    <div class="h-4 bg-slate-200 rounded w-5/6"></div>
                    <div class="h-4 bg-slate-200 rounded w-4/5"></div>
                </div>
            </div>
        </article>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center py-3 px-6
                bg-white/90 backdrop-blur border-t border-slate-100 z-50">
        <a href="dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600">
            <span class="material-symbols-outlined">home</span>
            <span class="text-[9px] font-medium mt-0.5">Home</span>
        </a>
        <a href="library.html" class="flex flex-col items-center text-slate-400 hover:text-indigo-600">
            <span class="material-symbols-outlined">book</span>
            <span class="text-[9px] font-medium mt-0.5">Library</span>
        </a>
        <a href="ai_assistant.html" class="flex flex-col items-center text-indigo-600">
            <span class="material-symbols-outlined">smart_toy</span>
            <span class="text-[9px] font-medium mt-0.5">AI</span>
        </a>
    </nav>

    <script src="assets/js/main.js"></script>
</body>
</html>
